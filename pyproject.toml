[project]
name = "miniserve"
version = "0.0.1"
description = "Minimal LLM serving engine: paged KV cache and continuous batching"
requires-python = ">=3.13.7"
dependencies = ["torch>=2.5", "safetensors>=0.4", "tokenizers>=0.20"]

[dependency-groups]
dev = ["pytest>=8", "transformers>=4.51", "ruff>=0.6", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
reportUnknownVariableType = "warning"
