[project]
name = "miniserve"
version = "0.0.1"
description = "Minimal LLM serving engine: paged KV cache and continuous batching"
requires-python = ">=3.12"
dependencies = ["torch>=2.5", "safetensors>=0.4", "tokenizers>=0.20"]

[dependency-groups]
dev = ["pytest>=8", "transformers>=4.51"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
